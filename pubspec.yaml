name: samsung_health_reporter
description: Reads, writes and observes Samsung Health data on Android through the Samsung Health Data SDK, wrapping the Kotlin library SamsungHealthReporter.
version: 1.0.0
homepage: https://github.com/kvs-coder/samsung_health_reporter
repository: https://github.com/kvs-coder/samsung_health_reporter
issue_tracker: https://github.com/kvs-coder/samsung_health_reporter/issues
topics:
  - health
  - samsung-health
  - android
  - fitness

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.kvs.samsung_health_reporter
        pluginClass: SamsungHealthReporterPlugin
